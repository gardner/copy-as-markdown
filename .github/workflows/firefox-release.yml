name: Signed Firefox release

on:
  workflow_dispatch:
  push:
    tags: ['firefox-v*']

permissions:
  contents: read

concurrency:
  group: signed-firefox-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    if: github.repository == 'gardner/copy-as-markdown' && (startsWith(github.ref, 'refs/tags/firefox-v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check version and release status before submission
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json")).version')
          TAG="firefox-v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
            echo 'Release tag must match package.json.'; exit 1
          fi
          # A failed API query must stop signing, not masquerade as a missing release.
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "$TAG" /tmp/release-tags; then
            echo 'Release already exists; use a new version.'; exit 1
          fi
      - run: pnpm package:firefox
      - run: pnpm lint:firefox
      - name: Sign through Mozilla's unlisted channel
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: pnpm sign:firefox
      - run: pnpm release:prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-firefox-release
          path: dist/firefox-release/
          if-no-files-found: error
      - name: Publish signed XPI, source, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json")).version')
          gh release create "firefox-v$VERSION" dist/firefox-release/* \
            --target "$GITHUB_SHA" --title "Copy as Markdown Firefox v$VERSION" \
            --notes-file docs/FIREFOX_RELEASE_NOTES.md
